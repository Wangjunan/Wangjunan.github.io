<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑上色演示｜君安</title><style>:root{--ink:#17211e;--paper:#f5f2ea}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-serif,"Noto Serif SC","Songti SC",serif}main{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,760px);background:#fffdf8;border:1px solid #dcd5c8;box-shadow:0 18px 60px #1b21171a;overflow:hidden}header{padding:26px 28px 18px;display:flex;justify-content:space-between;gap:16px;align-items:end}h1{font-size:clamp(22px,4vw,36px);margin:0;font-weight:600;letter-spacing:.06em}p{margin:7px 0 0;color:#59645d;line-height:1.65}.badge{font:12px ui-sans-serif,sans-serif;letter-spacing:.1em;color:#8c5a2e;white-space:nowrap}button{border:0;background:transparent;width:100%;padding:0;cursor:pointer;display:block}svg{display:block;width:100%;height:auto;background:linear-gradient(145deg,#e6e5d9,#cad9dc)}.line{fill:#f9f7ef;stroke:#1f2926;stroke-width:3;stroke-linejoin:round;transition:fill .8s ease,stroke .8s ease}.detail{fill:none;stroke:#52645d;stroke-width:2;stroke-linecap:round;transition:stroke .8s ease}.glass{fill:#eef5f2;stroke:#1f2926;stroke-width:3;transition:fill .8s ease}.ground{fill:#dce0ce;transition:fill .8s ease}.on .line{fill:#bb7a4c;stroke:#4e3829}.on .glass{fill:#597f8f;stroke:#304d55}.on .detail{stroke:#e9d2a1}.on .ground{fill:#718c64}.on #sky{fill:#efbd80}.on #sun{fill:#ffe7a0}.on #mountain{fill:#71866d}footer{padding:16px 28px 24px;font:14px ui-sans-serif,system-ui,sans-serif;color:#66716a;display:flex;justify-content:space-between;gap:12px}@media(max-width:520px){header{display:block;padding:22px 20px 14px}.badge{margin-top:10px}footer{padding:14px 20px 20px;font-size:13px}}</style></head><body><main><section class="card"><header><div><h1>建筑 · 光影上色</h1><p>点击建筑，查看线稿如何变成有温度的空间。</p></div><span class="badge" id="state">LINE ART</span></header><button id="scene" aria-label="切换建筑上色效果" aria-pressed="false"><svg viewBox="0 0 900 600" role="img" aria-label="可点击上色的建筑线稿"><rect id="sky" width="900" height="600" fill="#e9edf0"/><circle id="sun" cx="720" cy="104" r="44" fill="#f8f5e8"/><path id="mountain" d="M0 252 160 130l112 97 98-122 176 147 123-83 221 137v294H0z" fill="#d4d9cf"/><path class="ground" d="M0 420 900 366v234H0z"/><g><path class="line" d="M180 430V214l174-104 0 320z"/><path class="line" d="M354 430V110l262 128v192z"/><path class="line" d="M616 430V238l120-70v262z"/><path class="glass" d="M390 156l190 93v145H390z"/><path class="glass" d="M221 238l94-56v212h-94z"/><path class="glass" d="M650 267l50-29v156h-50z"/><path class="detail" d="M390 226h190M390 296h190M453 187v207M517 218v176M221 298h94M650 318h50"/><path class="detail" d="M130 431h660M268 431v-37h90v37M455 431v-37h90v37"/></g></svg></button><footer><span>点击任意建筑区域开始演示</span><span>JUNNAN.ME · DEMO</span></footer></section></main><script>const scene=document.querySelector('#scene'),state=document.querySelector('#state');scene.addEventListener('click',()=>{const on=scene.classList.toggle('on');scene.setAttribute('aria-pressed',on);state.textContent=on?'COLORED SPACE':'LINE ART'})</script></body></html>
